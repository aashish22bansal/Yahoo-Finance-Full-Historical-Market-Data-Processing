# Hadoop Metrics2 configuration
# Collect metrics from all components and write to local file

*.period=10
*.source.filter.class=org.apache.hadoop.metrics2.filter.GlobFilter

# --- Enable FileSink for all components ---
*.sink.file.class=org.apache.hadoop.metrics2.sink.FileSink
*.sink.file.filename=hadoop-metrics.log

# Optional: log to a subfolder
*.sink.file.basepath=C:/hadoopdata/metrics

# --- Enable JMX for real-time inspection ---
*.sink.jmx.class=org.apache.hadoop.metrics2.sink.JmxSink

# --- Enable common systems ---
namenode.sink.file.filename=namenode-metrics.log
datanode.sink.file.filename=datanode-metrics.log
jobtracker.sink.file.filename=jobtracker-metrics.log
tasktracker.sink.file.filename=tasktracker-metrics.log
maptask.sink.file.filename=maptask-metrics.log
reducetask.sink.file.filename=reducetask-metrics.log