name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-hadoop:
    name: Build Hadoop job (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: app-hadoop/hadoop-finance/pom.xml

      - name: Build with Maven
        run: mvn -B -f app-hadoop/hadoop-finance/pom.xml clean package

  build-django:
    name: Build Django app (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app-django/requirements.txt

      - name: Install dependencies
        working-directory: app-django
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: app-django
        run: python manage.py check

      - name: Run tests
        working-directory: app-django
        run: python manage.py test
