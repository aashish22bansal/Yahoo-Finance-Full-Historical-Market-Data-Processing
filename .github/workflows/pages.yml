name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "ABOUT.md"
      - "site/template-head.html"
      - "site/template-foot.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render ABOUT.md to HTML
        run: |
          mkdir -p _site
          npx --yes marked --gfm ABOUT.md > /tmp/body.html
          cat site/template-head.html /tmp/body.html site/template-foot.html > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
