<!DOCTYPE html>
<html>
<head>
    <title>Financial Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        select { padding: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

<h2>Yahoo Finance – Monthly Dashboard</h2>

<form method="get">
    <label>Select Ticker:</label>
    <select name="ticker" onchange="this.form.submit()">
        {% for t in tickers %}
            <option value="{{ t }}" {% if t == selected_ticker %}selected{% endif %}>
                {{ t }}
            </option>
        {% endfor %}
    </select>
</form>

<div>
    {{ chart|safe }}
</div>

</body>
</html>
